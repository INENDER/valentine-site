<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>She Said Yes!</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(to right, #ff758c, #ff7eb3);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
}

.card {
    background: #ffffff;
    padding: 25px;
    border-radius: 25px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    width: 100%;
    max-width: 420px;
}

/* Image Styling */
.card img {
    width: 50%;
    height: auto;
    border-radius: 20px;
    margin-bottom: 20px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.25);
    object-fit: cover;
}

h2 {
    margin-top: 10px;
    color: #ff3366;
    font-size: 22px;
}

#typeText {
    line-height: 1.6;
    font-size: 15px;
    margin-top: 15px;
    white-space: pre-wrap;
}

@media (max-width: 480px) {
    .card {
        padding: 18px;
    }

    h2 {
        font-size: 20px;
    }

    #typeText {
        font-size: 14px;
    }

    .card img {
        width: 70%;
    }
}
</style>
</head>

<body>

<!-- Background Music -->
<audio id="bgMusic" loop>
    <source src="music.mp3" type="audio/mpeg">
</audio>

<script>
window.addEventListener("load", function () {
    var music = document.getElementById("bgMusic");
    music.volume = 0.8;

    function playMusic() {
        music.play();
        document.removeEventListener("touchstart", playMusic);
        document.removeEventListener("click", playMusic);
    }

    // Try autoplay
    music.play().catch(function () {
        document.addEventListener("touchstart", playMusic, { once: true });
        document.addEventListener("click", playMusic, { once: true });
    });
});
</script>

<div class="card">

    <img src="couple2.jpg" alt="Our Love ❤️">

    <div style="font-size:40px;">🤗 🌸 💕</div>

    <h2>Yay! She said YES 💞</h2>

    <div id="typeText"></div>

</div>

<script>
const message = `
Congratulations, My Dearest Kiran ❤️

Today is not just a day… it’s a memory I will cherish for a lifetime ✨
Our first Valentine as husband and wife makes my heart feel so full and grateful 💑

You are my today, my tomorrow, and my forever.
My home, my happiness, my biggest blessing.

Thank you for being my beautiful wife,
my best friend, my love, my everything 💖

I promise to love you more with every sunrise,
to stand by you in every moment,
and to hold your hand forever 🤝❤️

I love you endlessly, now and always 💘🌹

Forever Yours,
Your Loving Husband 💞
`;

let i = 0;
const speed = 35;
const textContainer = document.getElementById("typeText");

function typeWriter() {
    if (i < message.length) {
        textContainer.innerHTML += message.charAt(i);
        i++;
        setTimeout(typeWriter, speed);
    }
}

window.addEventListener("load", function () {
    setTimeout(typeWriter, 800);
});
</script>

</body>
</html>
