<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>For My Love Kiran ❤️</title>

<style>
body{
margin:0;
font-family:Arial;
background:linear-gradient(135deg,#ff9a9e,#fad0c4);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
}

/* hearts */
.heart{
position:fixed;
bottom:-10px;
font-size:20px;
animation:floatUp 6s linear infinite;
}
@keyframes floatUp{
0%{transform:translateY(0);opacity:1;}
100%{transform:translateY(-110vh);opacity:0;}
}

.card{
background:rgba(255,255,255,0.95);
padding:35px;
border-radius:25px;
text-align:center;
box-shadow:0 0 25px rgba(255,0,90,0.6);
width:360px;
}

img{
width:180px;
height:180px;
object-fit:cover;
border-radius:50%;
border:5px solid #ff4d6d;
box-shadow:0 0 20px rgba(255,0,90,0.6);
margin-bottom:15px;
}

button{
padding:12px 25px;
border:none;
border-radius:25px;
font-size:16px;
margin:10px;
cursor:pointer;
}

.yes{background:#ff4d6d;color:white;}
.no{background:#ccc;position:absolute;}
</style>
</head>

<body>

<script>
for(let i=0;i<25;i++){
let h=document.createElement("div");
h.className="heart";
h.innerHTML="❤️";
h.style.left=Math.random()*100+"vw";
h.style.animationDuration=(4+Math.random()*4)+"s";
document.body.appendChild(h);
}
</script>

<div class="card" id="card">

<img id="slide" src="couple1.jpg">

<h2>Kiran 💖 Will you be mine forever?</h2>
